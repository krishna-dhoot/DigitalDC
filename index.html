<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b2a44">
<title>DigitalDC</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --ink:#1b2a44; --ink-soft:#5b6b85; --paper:#eef2f6; --card:#ffffff;
    --line:#d7dee6; --accent:#d9622b; --accent-ink:#fff; --good:#3f7d58; --warn:#b8862e; --bad:#c0392b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:var(--ink);}
  header{background:var(--ink);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em;}
  header .sub{font-size:11px;color:#aab6cb;margin-top:2px;}
  main{max-width:640px;margin:0 auto;padding:16px;padding-bottom:100px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;}
  .empty{text-align:center;color:var(--ink-soft);padding:40px 16px;}
  .empty p{font-size:14px;line-height:1.6;}

  /* capture */
  .capture-zone{border:2px dashed var(--line);border-radius:10px;padding:36px 16px;text-align:center;color:var(--ink-soft);cursor:pointer;}
  .capture-zone:active{background:#e5ebf1;}
  .capture-zone .icon{font-size:34px;display:block;margin-bottom:8px;}
  input[type=file]{display:none;}
  #preview{width:100%;border-radius:8px;display:block;margin-bottom:12px;max-height:360px;object-fit:contain;background:#000;}

  /* status */
  .status-row{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-soft);padding:10px 0;}
  .spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex:0 0 auto;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* form */
  label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 5px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=date],textarea{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:7px;font-size:15px;
    background:#fbfcfd;color:var(--ink);font-family:inherit;
  }
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .conf-low{border-color:var(--warn);background:#fdf6ea;}
  .conf-flag{font-size:10.5px;color:var(--warn);margin-top:3px;}

  .mat-row{display:grid;grid-template-columns:1fr 70px 70px 30px;gap:8px;margin-bottom:8px;align-items:center;}
  .mat-row input{padding:9px;font-size:13.5px;}
  .mat-remove{background:none;border:none;color:var(--bad);font-size:18px;cursor:pointer;padding:4px;}
  .mat-add{background:none;border:1px dashed var(--line);border-radius:7px;color:var(--ink-soft);padding:9px;width:100%;font-size:13px;cursor:pointer;margin-top:2px;}

  .btn{display:block;width:100%;padding:13px;border-radius:8px;border:none;font-size:15px;font-weight:600;cursor:pointer;text-align:center;}
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-primary:disabled{opacity:.5;}
  .btn-secondary{background:none;border:1px solid var(--line);color:var(--ink-soft);margin-top:8px;}
  .btn-row{margin-top:18px;}

  /* ledger */
  .rec{border-bottom:1px solid var(--line);padding:12px 0;}
  .rec:last-child{border-bottom:none;}
  .rec-top{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:600;}
  .rec-date{color:var(--ink-soft);font-weight:400;font-size:12px;}
  .rec-mats{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .pill-queued{background:#fdf6ea;color:var(--warn);}
  .pill-synced{background:#e8f3ec;color:var(--good);}

  .fab{position:fixed;bottom:20px;right:20px;left:20px;max-width:600px;margin:0 auto;}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:10;}
  nav.tabs button{flex:1;padding:12px 0;background:none;border:none;font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  nav.tabs button.active{color:var(--accent);}
</style>
</head>
<body>

<header>
  <div>
    <h1>DigitalDC</h1>
    <div class="sub" id="site-label">— site not set —</div>
  </div>
  <div id="sync-badge" style="font-size:11px;color:#aab6cb;"></div>
</header>

<main id="view-capture">
  <!-- populated by app.js -->
</main>

<nav class="tabs">
  <button id="tab-capture" class="active" onclick="showTab('capture')">📷 Capture</button>
  <button id="tab-ledger" onclick="showTab('ledger')">📋 Ledger</button>
  <button id="tab-settings" onclick="showTab('settings')">⚙️ Site</button>
</nav>

<script src="app.js"></script>
</body>
</html>
